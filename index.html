<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Johnson's Hub - Football Edge AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0a0e17; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #00d4ff; font-size: 2rem; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #8899aa; margin-bottom: 30px; }
        .card { background: #111b26; border: 1px solid #1a2a3a; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .card h3 { color: #00d4ff; margin-bottom: 10px; }
        .match { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1a2a3a; }
        .match:last-child { border-bottom: none; }
        .teams { font-weight: bold; }
        .odds { color: #ffd700; }
        .prediction { background: #00d4ff22; color: #00d4ff; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem; }
        .btn { background: #00d4ff; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 5px; }
        .btn:hover { opacity: 0.8; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
        .stat { text-align: center; flex: 1; min-width: 80px; }
        .stat .label { font-size: 0.7rem; color: #8899aa; }
        .stat .value { font-size: 1.2rem; font-weight: bold; }
        .stat .value.green { color: #00ff88; }
        .sidebar-btn { background: #1a2a3a; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; }
        .sidebar-btn:hover { background: #2a3a4a; }
    </style>
</head>
<body>

    <div class="container">
        <button class="sidebar-btn" onclick="toggleSidebar()">☰ Menu</button>
        
        <h1>⚡ JOHNSON'S HUB</h1>
        <p class="subtitle">FOOTBALL EDGE AI · BETTER SMARTER NOT HARDER</p>

        <!-- Matches -->
        <div class="card">
            <h3>🏆 ENGLAND: PREMIER LEAGUE</h3>
            <div class="flex">
                <button class="btn" onclick="filterMatches('all')">All</button>
                <button class="btn" onclick="filterMatches('live')">Live</button>
                <button class="btn" onclick="filterMatches('upcoming')">Upcoming</button>
                <button class="btn" onclick="fetchMatches()">🔄 Refresh</button>
            </div>
            <div id="matchesContainer">
                <div style="text-align:center;padding:20px;color:#8899aa;">⏳ Loading matches...</div>
            </div>
        </div>

        <!-- AI Predictions -->
        <div class="card">
            <h3>🤖 AI PREDICTIONS</h3>
            <div id="aiPicks" style="display:flex;gap:10px;flex-wrap:wrap;">
                <span style="background:#00d4ff22;color:#00d4ff;padding:4px 12px;border-radius:12px;">🏠 HOME</span>
                <span style="background:#00d4ff22;color:#00d4ff;padding:4px 12px;border-radius:12px;">🏠 HOME</span>
                <span style="background:#ffd70022;color:#ffd700;padding:4px 12px;border-radius:12px;">⚖️ DRAW</span>
                <span style="background:#ff6b6b22;color:#ff6b6b;padding:4px 12px;border-radius:12px;">✈️ AWAY</span>
            </div>
        </div>

        <!-- Bankroll -->
        <div class="card">
            <h3>💰 BANKROLL OVERVIEW</h3>
            <div style="display:flex;gap:20px;flex-wrap:wrap;">
                <div class="stat"><div class="label">Total</div><div class="value">$1,250</div></div>
                <div class="stat"><div class="label">Today</div><div class="value green">+$86.40</div></div>
                <div class="stat"><div class="label">ROI</div><div class="value green">+6.91%</div></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // DEMO MATCH DATA
        // ============================================
        const demoMatches = [
            { home: 'Arsenal', away: 'Chelsea', time: '12:30', homeOdds: 1.85, drawOdds: 3.60, awayOdds: 4.20 },
            { home: 'Liverpool', away: 'Bournemouth', time: '15:00', homeOdds: 1.44, drawOdds: 4.80, awayOdds: 6.80 },
            { home: 'Man City', away: 'Newcastle', time: '15:00', homeOdds: 1.58, drawOdds: 4.30, awayOdds: 5.60 },
            { home: 'Aston Villa', away: 'Everton', time: '15:00', homeOdds: 2.05, drawOdds: 3.40, awayOdds: 3.80 },
            { home: 'Tottenham', away: 'Man Utd', time: '17:30', homeOdds: 1.95, drawOdds: 3.70, awayOdds: 4.10 }
        ];

        let allMatches = [...demoMatches];

        // ============================================
        // RENDER MATCHES
        // ============================================
        function renderMatches(matches) {
            const container = document.getElementById('matchesContainer');
            
            if (!matches || matches.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:#8899aa;">📭 No matches</div>';
                return;
            }

            let html = '';
            matches.forEach(function(m) {
                // Calculate prediction
                let prediction = 'DRAW';
                let predColor = '#ffd700';
                if (m.homeOdds < m.drawOdds && m.homeOdds < m.awayOdds) {
                    prediction = 'HOME';
                    predColor = '#00d4ff';
                } else if (m.awayOdds < m.homeOdds && m.awayOdds < m.drawOdds) {
                    prediction = 'AWAY';
                    predColor = '#ff6b6b';
                }

                html += '<div class="match" onclick="alert(\'📊 ' + m.home + ' vs ' + m.away + '\n\n🤖 AI Prediction: ' + prediction + '\n\nOdds: ' + m.homeOdds + ' | ' + m.drawOdds + ' | ' + m.awayOdds + '\')">';
                html += '<span class="teams">' + m.time + ' <strong>' + m.home + '</strong> vs ' + m.away + '</span>';
                html += '<span><span class="odds">' + m.homeOdds + '</span> <span class="odds">' + m.drawOdds + '</span> <span class="odds">' + m.awayOdds + '</span>';
                html += ' <span class="prediction">' + prediction + '</span></span>';
                html += '</div>';
            });

            container.innerHTML = html;
        }

        // ============================================
        // FILTERS
        // ============================================
        function filterMatches(filter) {
            if (filter === 'live') {
                renderMatches(allMatches.slice(0, 2));
            } else if (filter === 'upcoming') {
                renderMatches(allMatches.slice(2));
            } else {
                renderMatches(allMatches);
            }
        }

        // ============================================
        // REFRESH
        // ============================================
        function fetchMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#8899aa;">⏳ Refreshing...</div>';
            setTimeout(function() {
                renderMatches(allMatches);
            }, 500);
        }

        // ============================================
        // SIDEBAR
        // ============================================
        function toggleSidebar() {
            alert('📱 Sidebar menu coming soon!\n\n🏴󠁧󠁢󠁥󠁮󠁧󠁿 ENGLAND\n🇪🇸 SPAIN\n🇮🇹 ITALY\n🇩🇪 GERMANY\n🇫🇷 FRANCE');
        }

        // ============================================
        // INIT
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            renderMatches(allMatches);
            console.log('⚡ Johnson\'s Hub loaded!');
        });
    </script>

</body>
</html>
